
services:
  # ==========================================================
  # KAFKA
  # ==========================================================
  kafka:
    image: apache/kafka:4.1.0
    container_name: binance-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ==========================================================
  # KAFKA OFFSET EXPORTER
  # ==========================================================
  kafka-offset-exporter:
    image: apache/kafka:4.1.0
    container_name: binance-kafka-offset-exporter
    depends_on:
      kafka:
        condition: service_healthy
    user: root
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-binance.trades.raw}
    volumes:
      - .:/opt/project
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        mkdir -p /opt/project/.run
        while true; do
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          offsets=$$(/opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server kafka:29092 --topic "$${KAFKA_TOPIC}" --time latest 2>/dev/null | tr '\n' ',' | sed 's/,$$//')
          printf '{"timestamp":"%s","topic":"%s","offsets":"%s"}\n' "$$ts" "$${KAFKA_TOPIC}" "$$offsets" > /opt/project/.run/kafka_latest.json.tmp
          mv /opt/project/.run/kafka_latest.json.tmp /opt/project/.run/kafka_latest.json
          sleep 30
        done
    restart: unless-stopped

  # ==========================================================
  # SPARK
  # ==========================================================
  spark:
    image: apache/spark:3.5.6
    container_name: binance-spark
    depends_on:
      - kafka
    working_dir: /opt/project
    environment:
      AWS_REGION: ${AWS_DEFAULT_REGION:-ap-south-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-2}
    volumes:
      - .:/opt/project
      - ${USERPROFILE}/.aws:/home/spark/.aws:ro
    command: ["/bin/bash", "-lc", "sleep infinity"]
    restart: unless-stopped

  # ==========================================================
  # SPARK STREAMING - KAFKA TO S3
  # ==========================================================
  spark-streaming:
    image: apache/spark:3.5.6
    container_name: binance-spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /opt/project
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_SHARED_CREDENTIALS_FILE: /home/spark/.aws/credentials
      AWS_CONFIG_FILE: /home/spark/.aws/config
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_STARTING_OFFSETS: earliest
      S3_BUCKET: ${S3_BUCKET}
      S3_OUTPUT_PATH: s3a://${S3_BUCKET}/landing/streaming/trades_recovery/
      S3_CHECKPOINT_PATH: s3a://${S3_BUCKET}/metadata/checkpoints/binance_trades_streaming_v2/
    volumes:
      - .:/opt/project
      - ${USERPROFILE}/.aws:/home/spark/.aws:ro
      - spark_ivy:/tmp/.ivy2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.executor.heartbeatInterval=60s
      - --conf
      - spark.network.timeout=300s
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      - --conf
      - spark.sql.streaming.stopGracefullyOnShutdown=true
      - src/streaming/spark_to_s3_recovery.py
    restart: unless-stopped

  # ==========================================================
  # AI SERVING - FASTAPI
  # ==========================================================
  ai-serving:
    build:
      context: .
      dockerfile: ai_serving/Dockerfile
    image: binance-ai-serving:latest
    container_name: binance-ai-serving
    working_dir: /app
    command:
      - uvicorn
      - ai_serving.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - ./ai_serving/.env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================
  # AIRFLOW METADATA DATABASE
  # ==========================================================
  airflow-postgres:
    image: postgres:16
    container_name: binance-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================================
  # COMMON AIRFLOW CONFIGURATION
  # ==========================================================
  airflow-common: &airflow-common
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: binance-airflow:3.3.2
    environment: &airflow-environment
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow

      # Airflow 3 authentication
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      # Core settings
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

      # Security
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in root .env}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in root .env}

      # Scheduler and DAG processor
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"

      # Binance project settings
      PYTHONPATH: /opt/airflow/project
      S3_BUCKET: ${S3_BUCKET:-binance-market-data-lake}
      S3_STREAMING_PREFIX: landing/streaming/trades_recovery/
      AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials
      AWS_CONFIG_FILE: /home/airflow/.aws/config
      AWS_DEFAULT_REGION: ap-south-1
      STREAMING_FRESHNESS_MINUTES: "10"
      STREAMING_CHECKPOINT_FRESHNESS_MINUTES: "6"
      KAFKA_TOPIC: ${KAFKA_TOPIC:-binance.trades.raw}
      KAFKA_MAX_LAG_MESSAGES: "5000"
      KAFKA_HEALTH_FRESHNESS_MINUTES: "3"
      S3_CHECKPOINT_PREFIX: metadata/checkpoints/binance_trades_streaming_v2/
      MAX_ORPHAN_FILES: "12"
      AI_API_BASE_URL: ${AI_API_BASE_URL:-http://host.docker.internal:8000}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
      - ${USERPROFILE}/.aws:/home/airflow/.aws:ro

    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================
  # AIRFLOW INITIALIZATION
  # ==========================================================
  airflow-init:
    <<: *airflow-common
    container_name: binance-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    environment:
      <<: *airflow-environment
    restart: "no"

  # ==========================================================
  # AIRFLOW API SERVER
  # ==========================================================
  airflow-api-server:
    <<: *airflow-common
    container_name: binance-airflow-api-server
    command: api-server
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: binance-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================
  # AIRFLOW DAG PROCESSOR
  # ==========================================================
  airflow-dag-processor:
    <<: *airflow-common
    container_name: binance-airflow-dag-processor
    command: dag-processor

  # ==========================================================
  # AIRFLOW TRIGGERER
  # ==========================================================
  airflow-triggerer:
    <<: *airflow-common
    container_name: binance-airflow-triggerer
    command: triggerer

volumes:
  kafka_data:
  airflow_postgres_data:
  spark_ivy:
    name: binance_spark_ivy
